name: checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    env:
      SWIFT_BUILD_FLAGS: --configuration release --arch arm64 --arch x86_64 --build-system swiftbuild

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build a universal binary
        run: swift build $SWIFT_BUILD_FLAGS

      - name: Locate the binary
        run: echo "BIN=$(swift build $SWIFT_BUILD_FLAGS --show-bin-path)/ql" >> "$GITHUB_ENV"

      - name: Check the architectures
        run: test "$(lipo -archs "$BIN")" = "x86_64 arm64"

      - name: Perform a test run
        run: 'test -x "$BIN" && test "$("$BIN")" = "Usage: ql [--title <title>] <path>"'

  vint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install --upgrade pip && pip install vim-vint

      - name: Run vint
        run: vint .
