name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest

    permissions:
      attestations: write
      contents: write
      id-token: write

    env:
      SWIFT_BUILD_FLAGS: --configuration release --arch arm64 --arch x86_64 --build-system swiftbuild

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build a universal binary
        run: swift build $SWIFT_BUILD_FLAGS

      - name: Locate the binary
        run: echo "BIN=$(swift build $SWIFT_BUILD_FLAGS --show-bin-path)/ql" >> "$GITHUB_ENV"

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.BIN }}


      - name: Create a release
        run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the built binary
        run: gh release upload ${{ github.ref_name }} "$BIN"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
